<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sleepy Meow</title>
<meta name="color-scheme" content="dark light" />

<!-- Markdown rendering + sanitisation + syntax highlighting (CDN) -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" />
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>

<style>
  /* ────────────────────────────────────────────────────────
     Palette mirrored from the "Things" Obsidian theme
     (by @colineckert). Dark is the default; light follows the
     OS preference. Base/accent values match Things' tokens.
     ──────────────────────────────────────────────────────── */
  :root {
    --bg:           #1c2127;  /* base-00  main window      */
    --bg-soft:      #282c34;  /* base-10  code / surfaces   */
    --sidebar:      #181c20;  /* base-20  nav background    */
    --panel:        #2c313c;  /* base-25  inputs / hover    */
    --border:       #35393e;  /* base-30  dividing lines    */
    --text:         #dadada;  /* base-100 normal text       */
    --muted:        #b3b9c0;  /* text-muted                 */
    --faint:        #5f6b78;  /* text-faint                 */
    --accent:       hsl(215, 75%, 70%);
    --accent-hover: hsl(215, 75%, 80%);
    --blue:         #2e80f2;  /* H3                         */
    --yellow:       #e5b567;  /* H4                         */
    --pink:         #ff82b2;  /* bold / italic              */
    --green:        #3eb4bf;  /* blockquote                 */
    --code-bg:      #282c34;
    --highlight:    rgba(255, 208, 0, .4);
    --radius:       8px;
    --radius-s:     4px;
    --sidebar-w:    290px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg:           #ffffff;
      --bg-soft:      #f6f7f8;
      --sidebar:      #f2f3f5;
      --panel:        #ffffff;
      --border:       #ebedf0;
      --text:         #222222;
      --muted:        #545b63;
      --faint:        #9aa0a6;
      --accent:       hsl(215, 75%, 60%);
      --accent-hover: hsl(215, 75%, 50%);
      --blue:         #086ddd;
      --yellow:       #bd8e37;
      --pink:         #c32b74;
      --green:        #2db7b5;
      --code-bg:      #f6f7f8;
      --highlight:    rgba(255, 208, 0, .4);
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Ubuntu, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    display: flex;
    min-height: 100vh;
  }

  /* ---------- Sidebar ---------- */
  #sidebar {
    width: var(--sidebar-w);
    flex: 0 0 var(--sidebar-w);
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    height: 100vh;
    position: sticky;
    top: 0;
    overflow-y: auto;
    padding: 22px 12px 40px;
  }
  .brand {
    display: flex; align-items: center; gap: 9px;
    font-size: 1.05rem; font-weight: 700; letter-spacing: .2px;
    color: var(--text);
    padding: 4px 10px 18px;
  }
  .brand .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent);
  }
  #search {
    width: 100%; padding: 8px 12px; margin-bottom: 16px;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius);
    font-size: .88rem; outline: none;
    transition: border-color .12s, box-shadow .12s;
  }
  #search:focus { border-color: var(--accent); box-shadow: 0 0 0 2px hsl(215 75% 60% / .2); }

  .folder { margin-bottom: 12px; }
  .folder > .folder-title {
    font-size: .72rem; text-transform: uppercase; letter-spacing: .08em;
    color: var(--faint); font-weight: 700;
    padding: 6px 10px; display: flex; align-items: center; gap: 7px;
  }
  .folder-title::before { content: "▸"; font-size: .7em; opacity: .7; }
  nav a {
    display: block; text-decoration: none; color: var(--muted);
    padding: 5px 10px 5px 22px; border-radius: var(--radius-s);
    font-size: .9rem; transition: background .12s, color .12s;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  nav a:hover { background: var(--panel); color: var(--text); }
  nav a.active {
    background: var(--accent);
    color: #fff; font-weight: 500;
  }

  /* ---------- Main ---------- */
  main {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    justify-content: center;
    padding: 56px 48px 120px;
  }
  #content {
    width: 100%;
    max-width: 40rem;
  }
  .welcome { color: var(--muted); }
  .welcome h1 { color: var(--text); }

  /* ---------- Rendered markdown ---------- */
  .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 {
    line-height: 1.3; margin: 1.5em 0 .6em;
  }
  .md h1, .md .page-title { font-size: 1.8rem; font-weight: 800; color: var(--text);
           margin-top: 0; letter-spacing: -.01em; }
  .md h2 { font-size: 1.5rem; font-weight: 700; color: var(--text);
           border-bottom: 2px solid var(--border); padding-bottom: 3px; }
  .md h3 { font-size: 1.2rem; font-weight: 700; color: var(--blue); }
  .md h4 { font-size: 1.1rem; font-weight: 700; color: var(--yellow); }
  .md h5 { font-size: 1rem;   font-weight: 700; color: var(--text); }
  .md h6 { font-size: .9rem;  font-weight: 700; color: var(--muted); }
  .md p, .md li { color: var(--text); }
  .md strong { color: var(--pink); font-weight: 700; }
  .md em { color: var(--pink); }
  .md a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  .md a:hover { color: var(--accent-hover); }
  .md hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }
  .md blockquote {
    margin: 1.2em 0; padding: .2em 1.1em;
    border-left: 3px solid var(--border);
    color: var(--green); font-style: italic;
  }
  .md blockquote strong, .md blockquote em { color: var(--green); }
  .md code {
    background: var(--code-bg); padding: .15em .4em;
    border-radius: var(--radius-s); font-size: .88em;
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .md pre {
    background: var(--code-bg); border: 1px solid var(--border);
    padding: 16px; border-radius: var(--radius); overflow-x: auto;
  }
  .md pre code { background: none; padding: 0; }
  .md table { border-collapse: collapse; width: 100%; margin: 1.2em 0; }
  .md th, .md td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
  .md th { background: var(--bg-soft); }
  .md img {
    max-width: 100%; border-radius: var(--radius-s);
    box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.24);
  }
  .md mark {
    background: var(--highlight);
    color: inherit; padding: .05em .15em; border-radius: 2px;
  }
  .md ul, .md ol { padding-left: 1.4em; }
  .md li { margin: .3em 0; }

  /* ---------- Mobile ---------- */
  #menu-toggle {
    display: none; position: fixed; top: 14px; left: 14px; z-index: 30;
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 9px; padding: 8px 12px; font-size: 1rem; cursor: pointer;
  }
  #backdrop { display: none; }
  @media (max-width: 820px) {
    #menu-toggle { display: block; }
    #sidebar {
      position: fixed; z-index: 25; left: 0; top: 0;
      transform: translateX(-100%); transition: transform .22s ease;
      box-shadow: 0 0 40px rgba(0,0,0,.5);
    }
    body.nav-open #sidebar { transform: translateX(0); }
    body.nav-open #backdrop {
      display: block; position: fixed; inset: 0; z-index: 20;
      background: rgba(0,0,0,.5);
    }
    main { padding: 70px 22px 100px; }
  }
</style>
</head>
<body>
  <button id="menu-toggle" aria-label="Toggle menu">☰</button>
  <div id="backdrop"></div>

  <aside id="sidebar">
    <div class="brand"><span class="dot"></span><span id="brand-title">Sleepy Meow</span></div>
    <input id="search" type="search" placeholder="Search notes…" autocomplete="off" />
    <nav id="nav"></nav>
  </aside>

  <main>
    <article id="content" class="md">
      <div class="welcome">
        <h1>Loading…</h1>
      </div>
    </article>
  </main>

<script>
const nav     = document.getElementById('nav');
const content = document.getElementById('content');
const search  = document.getElementById('search');
const body    = document.body;
let manifest  = { folders: [] };

marked.setOptions({
  breaks: false,
  gfm: true,
  highlight: (code, lang) => {
    try {
      if (lang && hljs.getLanguage(lang)) return hljs.highlight(code, { language: lang }).value;
      return hljs.highlightAuto(code).value;
    } catch { return code; }
  }
});

// Obsidian-style ==highlight== → <mark>highlight</mark>
marked.use({ extensions: [{
  name: 'mark',
  level: 'inline',
  start(src) { return src.indexOf('=='); },
  tokenizer(src) {
    const m = /^==(?=\S)([\s\S]*?\S)==/.exec(src);
    if (m) return {
      type: 'mark',
      raw: m[0],
      tokens: this.lexer.inlineTokens(m[1])
    };
  },
  renderer(token) { return '<mark>' + this.parser.parseInline(token.tokens) + '</mark>'; }
}]});

function closeNav() { body.classList.remove('nav-open'); }
document.getElementById('menu-toggle').onclick = () => body.classList.toggle('nav-open');
document.getElementById('backdrop').onclick = closeNav;

function buildNav(folders) {
  nav.innerHTML = '';
  folders.forEach(folder => {
    const wrap = document.createElement('div');
    wrap.className = 'folder';
    const t = document.createElement('div');
    t.className = 'folder-title';
    t.textContent = folder.name;
    wrap.appendChild(t);
    folder.files.forEach(file => {
      const a = document.createElement('a');
      a.href = '#' + encodeURIComponent(file.path);
      a.textContent = file.name;
      a.dataset.path = file.path;
      a.dataset.search = (folder.name + ' ' + file.name).toLowerCase();
      wrap.appendChild(a);
    });
    nav.appendChild(wrap);
  });
}

function setActive(path) {
  document.querySelectorAll('nav a').forEach(a =>
    a.classList.toggle('active', a.dataset.path === path));
}

function titleFor(path) {
  for (const folder of manifest.folders)
    for (const file of folder.files)
      if (file.path === path) return file.name;
  // Fallback: derive from the filename.
  const base = path.split('/').pop().replace(/\.md$/i, '');
  return base.replace(/[-_]/g, ' ').trim();
}

async function loadFile(path) {
  setActive(path);
  closeNav();
  content.innerHTML = '<div class="welcome"><h1>Loading…</h1></div>';
  try {
    const res = await fetch(encodeURI(path), { cache: 'no-cache' });
    if (!res.ok) throw new Error(res.status);
    const raw = await res.text();
    const title = titleFor(path);
    document.title = title + ' · ' + (manifest.title || 'Notes');
    const heading = '<h1 class="page-title">' +
      title.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</h1>';
    const html = heading + DOMPurify.sanitize(marked.parse(raw));
    content.innerHTML = html;
    content.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
    // External links open in a new tab.
    content.querySelectorAll('a[href^="http"]').forEach(a => {
      a.target = '_blank'; a.rel = 'noopener noreferrer';
    });
    window.scrollTo(0, 0);
  } catch (e) {
    content.innerHTML = '<div class="welcome"><h1>Couldn’t load that note</h1>' +
      '<p>' + path + '</p></div>';
  }
}

function showWelcome() {
  document.title = manifest.title || 'Notes';
  const count = manifest.folders.reduce((n, f) => n + f.files.length, 0);
  content.innerHTML =
    '<div class="welcome">' +
    '<h1>' + (manifest.title || 'Notes') + '</h1>' +
    '<p>A small collection of ' + count + ' note' + (count === 1 ? '' : 's') +
    '. Pick one from the sidebar to start reading.</p></div>';
  setActive(null);
}

search.addEventListener('input', () => {
  const q = search.value.trim().toLowerCase();
  document.querySelectorAll('nav a').forEach(a => {
    a.style.display = !q || a.dataset.search.includes(q) ? '' : 'none';
  });
  document.querySelectorAll('.folder').forEach(f => {
    const anyVisible = [...f.querySelectorAll('a')].some(a => a.style.display !== 'none');
    f.style.display = anyVisible ? '' : 'none';
  });
});

function route() {
  const path = decodeURIComponent(location.hash.slice(1));
  if (path) loadFile(path); else showWelcome();
}
window.addEventListener('hashchange', route);

(async function init() {
  try {
    const res = await fetch('files.json', { cache: 'no-cache' });
    manifest = await res.json();
  } catch {
    content.innerHTML = '<div class="welcome"><h1>No manifest found</h1>' +
      '<p>Run <code>python3 build-index.py</code> to generate <code>files.json</code>.</p></div>';
    return;
  }
  document.title = manifest.title || 'Notes';
  document.getElementById('brand-title').textContent = manifest.title || 'Notes';
  buildNav(manifest.folders);
  route();
})();
</script>
</body>
</html>
